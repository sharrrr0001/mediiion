# Local development infrastructure only. Never put real patient data here.
name: medicos
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medicos
      POSTGRES_PASSWORD: medicos
      POSTGRES_DB: medicos
    ports: ['5434:5432']
    volumes: [pgdata:/var/lib/postgresql/data, ./docker/postgres-init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medicos']
      interval: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ['6380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      retries: 20
  s3:
    # S3-compatible object store (SeaweedFS). MinIO images are no longer published publicly.
    image: chrislusf/seaweedfs:3.97
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ['9000:9000']
    volumes: [s3data:/data, ./docker/s3/s3.json:/etc/seaweedfs/s3.json:ro]
  mailpit:
    image: axllent/mailpit:v1.27.0
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  s3data:
